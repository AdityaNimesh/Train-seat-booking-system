# Optional ../.env file (see .env.example) supplies DB_PASSWORD etc. Nothing secret is committed.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trainbooking}
spring.datasource.username=${DB_USER:trainbooking}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Business settings
app.lock-duration-seconds=120
app.expiry-sweep-ms=5000
# Enables POST /api/admin/reset (handy for demos and the concurrency script). Disable in real deployments.
app.demo-reset-enabled=true
