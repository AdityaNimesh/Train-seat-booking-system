# PostgreSQL for local development. Reads DB_* values from .env (copy .env.example first).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trainbooking}
      POSTGRES_USER: ${DB_USER:-trainbooking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trainbooking} -d ${DB_NAME:-trainbooking}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
